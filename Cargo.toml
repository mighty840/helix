[workspace]
members = [
    "helix-isa",
    "helix-ecc",
    "helix-bio",
    "helix-asm",
    "helix-vm",
    "helix-sim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sharang Parnerkar"]
license = "MIT"

[workspace.dependencies]
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# internal
helix-isa = { path = "helix-isa" }
helix-ecc = { path = "helix-ecc" }
helix-bio = { path = "helix-bio" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
